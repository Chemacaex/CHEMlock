<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
.login{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));overflow:auto}
.lbox{width:100%;max-width:380px;display:grid;gap:14px;text-align:center}
.llogo{width:96px;height:96px;border-radius:22px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.lbox form{display:grid;gap:10px;text-align:left}
.lerr{margin:0;font-size:14px;color:var(--bad);text-align:center}
.linkb{border:0;background:none;color:var(--accent);font-weight:600;padding:8px;font-size:14px}
</style>
<script>
// Puente: la app pide la base de datos y la recibe cuando hayas iniciado sesión.
(function(){
  var resolveDb; var dbReady = new Promise(function(r){ resolveDb = r; });
  window.__chemlockResolveDb = resolveDb;
  var downloads = { save: function(o){
    var blob = new Blob([o.data], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = o.filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 5000);
    return Promise.resolve();
  } };
  window.claude = { use: function(name){ return name === "db" ? dbReady : name === "downloads" ? Promise.resolve(downloads) : Promise.resolve(null); } };
  if ("serviceWorker" in navigator) window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
})();

<body>
<title>CHEMlock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: listas agrupadas al estilo iOS, una columna para el pulgar; ficha en hoja inferior y barra de pestañas abajo. */
:root{
  --bg:#F2F2F6; --surface:#FFFFFF; --sunk:#E9EAEF; --raised:#FFFFFF; --ink:#111318; --muted:#6A6F7D; --faint:#9BA0AC; --line:#E4E5EA;
  --accent:#4C55F0; --accent-ink:#FFFFFF; --accent-soft:#E7E8FE;
  --good:#1A8A4A; --good-soft:#DDF2E5; --warn:#A76500; --warn-soft:#FBEACC; --bad:#D22F3A; --bad-soft:#FADCDD;
  --yellow:#E2A400;
  --p-sw2:#E0243A; --p-sw:#FF7A4D; --p-steam:#2F86D8; --p-hw:#8A8F9B;
  --scrim:rgba(12,14,20,.42); --shadow:0 1px 2px rgba(16,18,24,.06),0 4px 14px rgba(16,18,24,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --f-body:"Figtree",-apple-system,"Segoe UI",system-ui,sans-serif;
  --nav-h:58px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0C10; --surface:#17191F; --sunk:#23262E; --raised:#2E323C; --ink:#F2F3F6; --muted:#A2A7B3; --faint:#6E7380; --line:#272A32;
  --accent:#8189FF; --accent-ink:#0B0C10; --accent-soft:#252A55;
  --good:#4CCB82; --good-soft:#14301F; --warn:#F0B04A; --warn-soft:#3A2B10; --bad:#FF6B72; --bad-soft:#3C1B1E;
  --p-sw2:#FF4D5E; --p-sw:#FF9670; --p-steam:#5AA6F0; --p-hw:#9097A4;
  --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0C10; --surface:#17191F; --sunk:#23262E; --raised:#2E323C; --ink:#F2F3F6; --muted:#A2A7B3; --faint:#6E7380; --line:#272A32;
  --accent:#8189FF; --accent-ink:#0B0C10; --accent-soft:#252A55;
  --good:#4CCB82; --good-soft:#14301F; --warn:#F0B04A; --warn-soft:#3A2B10; --bad:#FF6B72; --bad-soft:#3C1B1E;
  --p-sw2:#FF4D5E; --p-sw:#FF9670; --p-steam:#5AA6F0; --p-hw:#9097A4;
  --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,select,input,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{margin:0;font-family:var(--f-display);letter-spacing:-.015em;text-wrap:balance}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(var(--nav-h) + 92px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* Cabecera */
.title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:8px}
h1{font-size:32px;font-weight:800;line-height:1.05}
.summary{color:var(--muted);font-size:14px;margin-top:4px}
.summary b{color:var(--ink);font-weight:700}
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:grid;gap:8px;padding-block:10px 8px;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.searchrow{display:flex;gap:8px}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;height:40px;border:0;border-radius:11px;background:var(--sunk);padding:0 12px 0 36px;color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;left:11px;top:11px;width:18px;height:18px;color:var(--faint);pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:11px;border:0;background:var(--sunk);display:grid;place-items:center;color:var(--ink);position:relative;flex:0 0 auto}
.icon-btn svg{width:20px;height:20px}
.icon-btn.on{background:var(--accent);color:var(--accent-ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;min-height:34px;font-size:14px;font-weight:600;color:var(--muted);padding:0 6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill-x{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600}
.pill-x svg{width:14px;height:14px}

/* Listas agrupadas */
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:18px 4px 7px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sec span:last-child{text-transform:none;letter-spacing:0;font-weight:500}
.group{background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:58px;width:100%;border:0;background:none;text-align:left;color:inherit;position:relative}
button.row:active,.row[data-open]:active{background:var(--sunk)}
.row + .row::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--line)}
.rt{flex:1;min-width:0;display:grid;gap:2px}
.t{font-weight:600;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.done .t{color:var(--muted)}
.s{font-size:13px;color:var(--muted);display:flex;gap:4px 8px;align-items:center;flex-wrap:wrap}
.pd{display:inline-flex;align-items:center;gap:5px;color:var(--ink);font-weight:500}
.pd::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc);flex:0 0 auto}
.rr{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.ring{width:30px;height:30px;display:block}
.ring .tr{stroke:var(--sunk)} .ring .pr{stroke:var(--accent)} .ring.full .pr{stroke:var(--good)}
.okmark{width:26px;height:26px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center}
.okmark svg{width:15px;height:15px}
.tag{font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--sunk);color:var(--muted)}
.playb{width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.playb svg{width:15px;height:15px;margin-left:2px}
.live{height:34px;border-radius:17px;border:0;background:var(--bad);color:#fff;font-weight:700;font-size:13px;padding:0 12px;display:inline-flex;align-items:center;gap:6px}
.chev{width:8px;height:14px;color:var(--faint);flex:0 0 auto}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.banner{background:var(--warn-soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:10px}

/* Tarjetas de datos */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;margin-top:2px}
.tile .n{font-size:12px;color:var(--muted);margin-top:2px}
.card{background:var(--surface);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:grid;gap:10px}
.big{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.1}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.right{margin-left:auto;text-align:right;font-weight:600;white-space:nowrap}
.eur{font-size:12px;font-weight:700;border-radius:7px;padding:3px 8px;white-space:nowrap}
.eur.g{background:var(--good-soft);color:var(--good)} .eur.a{background:var(--warn-soft);color:var(--warn)} .eur.r{background:var(--bad-soft);color:var(--bad)} .eur.n{background:var(--sunk);color:var(--muted)}
.inline-in{width:64px;height:34px;border:0;border-radius:8px;background:var(--sunk);text-align:center;color:var(--ink)}
.note{font-size:13px;color:var(--muted);padding:8px 4px 0}
.wbars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end}
.wb{display:grid;gap:4px;justify-items:center;min-width:0}
.wb i{display:block;width:100%;max-width:26px;background:var(--accent);border-radius:5px 5px 2px 2px;opacity:.55}
.wb.now i{opacity:1}
.wb span{font-size:10px;color:var(--muted);white-space:nowrap}
.wb b{font-size:10px;font-weight:600;min-height:13px}
.btn{border:0;border-radius:12px;min-height:46px;padding:0 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--sunk);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:9px}

/* Barra de pestañas y botón añadir */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);padding:0 max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px))}
.nav .in{display:grid;grid-template-columns:repeat(6,1fr);max-width:640px;margin:0 auto}
.nav button{font-size:10.5px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--yellow:#F5C228}}
:root[data-theme="dark"]{--yellow:#F5C228}
/* Inicio */
.dcard{background:var(--surface);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:128px minmax(0,1fr);gap:14px;align-items:center}
.donut{width:128px;height:128px;display:block}
.donut .dc{fill:var(--ink);font-family:var(--f-body);font-size:25px;font-weight:700}
.donut .ds{fill:var(--muted);font-family:var(--f-body);font-size:11px;font-weight:500}
.lgd{display:grid;gap:2px;min-width:0}
.lg{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:14px;padding:6px 4px;border:0;background:none;text-align:left;color:inherit;border-radius:8px;width:100%}
button.lg:active{background:var(--sunk)}
.lg i{width:10px;height:10px;border-radius:3px}
.lg span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg b{font-weight:700}
.lg em{font-style:normal;color:var(--muted);font-size:12px;min-width:34px;text-align:right}
@media (max-width:360px){.dcard{grid-template-columns:1fr;justify-items:center}}
.tag.sale{background:var(--accent-soft);color:var(--accent)}
.pickc{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:block}
.nav button{border:0;background:none;height:var(--nav-h);display:grid;place-items:center;align-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--faint)}
.nav button svg{width:25px;height:25px}
.nav button[aria-selected="true"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));z-index:21;width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.fab svg{width:24px;height:24px}

/* Hojas inferiores */
.sheet{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet .box{background:var(--bg);width:100%;max-width:560px;max-height:93vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;overscroll-behavior:contain}
.grab{width:38px;height:5px;border-radius:3px;background:var(--faint);opacity:.5;margin:2px auto 0}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh h2{font-size:22px;font-weight:800;line-height:1.15}
.closeb{width:32px;height:32px;border-radius:50%;border:0;background:var(--sunk);color:var(--muted);display:grid;place-items:center;flex:0 0 auto}
.closeb svg{width:16px;height:16px}
.hours{background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:12px;box-shadow:var(--shadow)}
.hours .n{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
.hours .n small{font-size:16px;color:var(--muted);font-weight:500}
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stepper button{min-height:42px;border:0;border-radius:10px;background:var(--sunk);font-weight:700}
.btn.live{background:var(--bad);color:#fff}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;position:relative;font-size:15px}
.kv + .kv::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--line)}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-weight:600;min-width:0;overflow-wrap:anywhere}
.field{display:grid;gap:2px;padding:9px 14px;position:relative}
.field + .field::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--line)}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:0;background:transparent;padding:2px 0;width:100%;color:var(--ink);outline:none;min-height:28px}
.field.check{display:flex;align-items:center;justify-content:space-between;min-height:50px}
.field.check label{font-size:15px;color:var(--ink);font-weight:500}
.field.check input{width:22px;height:22px;accent-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr}
.two .field:nth-child(2)::before{content:"";position:absolute;top:0;bottom:0;left:0;width:1px;height:auto;background:var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}

@media (min-width:700px){ .sheet{align-items:center} .sheet .box{border-radius:20px} .grab{display:none} .tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (prefers-reduced-motion:no-preference){
  .bar i,.ring .pr{transition:all .35s ease}
  .sheet .box{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.7}to{transform:none;opacity:1}}
}
</style>

<div class="wrap">
  <div class="banner" id="banner" hidden></div>
  <main id="view"></main>
</div>

<button class="fab" id="fab" aria-label="Añadir juego">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="nav" aria-label="Secciones"><div class="in" role="tablist">
  <button role="tab" data-tab="inicio" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Inicio</button>
  <button role="tab" data-tab="juegos" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 7h11a4.5 4.5 0 0 1 4.4 5.4l-.9 4.4a2.5 2.5 0 0 1-4.3 1.2L15 16H9l-1.7 2a2.5 2.5 0 0 1-4.3-1.2l-.9-4.4A4.5 4.5 0 0 1 6.5 7z"/><path d="M7.5 10.5v3M6 12h3"/><circle cx="15.5" cy="11" r=".9" fill="currentColor"/><circle cx="17.5" cy="13" r=".9" fill="currentColor"/></svg>Juegos</button>
  <button role="tab" data-tab="deseos" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>Deseos</button>
  <button role="tab" data-tab="ventas" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1.5 1.5 0 0 1 0 2.1l-6.2 6.2a1.5 1.5 0 0 1-2.1 0z"/><circle cx="8.5" cy="8.5" r="1.6"/></svg>Ventas</button>
  <button role="tab" data-tab="economia" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 8.5a4 4 0 1 0 0 7M7.5 11h6M7.5 13.5h6"/></svg>Economía</button>
  <button role="tab" data-tab="informes" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg>Informes</button>
</div></nav>

<div id="sheetHost"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(() => {
"use strict";
// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf1 = new Intl.NumberFormat("es-ES",{maximumFractionDigits:1});
const nf0 = new Intl.NumberFormat("es-ES",{maximumFractionDigits:0});
const eur = v => v == null ? "—" : new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits: Number.isInteger(v)?0:2}).format(v);
const eur0 = v => new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(v);
const h = v => nf1.format(v || 0) + " h";
const parseNum = v => { if (v === "" || v == null) return null; const s = String(v).trim(); const n = parseFloat(s.includes(",") ? s.replace(/\./g,"").replace(",",".") : s); return isFinite(n) ? n : null; };
const YEAR = new Date().getFullYear();
const STATUS = [["pendiente","Pendiente"],["jugando","Jugando"],["pasado","Pasado"],["abandonado","Abandonado"]];
const STATUS_LABEL = Object.fromEntries(STATUS);
const KEY_SAGAS = ["Pokémon", "Monster Hunter", "Kingdom Hearts", "Zelda", "Xenoblade", "Resident Evil"];
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2300); }
const lsGet = (k,d) => { try { const v = localStorage.getItem(k); return v==null?d:JSON.parse(v); } catch { return d; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const I = {
  play: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.8v14.4c0 .8.9 1.3 1.6.9l11.5-7.2c.6-.4.6-1.3 0-1.7L8.6 3.9C7.9 3.5 7 4 7 4.8z"/></svg>`,
  x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`,
  filter: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>`,
  chev: `<svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1 1 6 6-6 6"/></svg>`
};

// ---------- consolas ----------
function platParts(p){ return (p||"").split(/\s+y\s+|,/).map(x=>x.trim().toLowerCase()).filter(Boolean); }
function onePlat(s){
  s = (s||"").trim().toLowerCase();
  if (!s) return ["Sin consola", "var(--p-hw)"];
  if (s.includes("switch 2") || s === "2") return ["Switch 2", "var(--p-sw2)"];
  if (s.includes("switch")) return ["Switch", "var(--p-sw)"];
  if (s.includes("steam") || s === "pc") return ["Steam", "var(--p-steam)"];
  if (s === "iphone") return ["iPhone", "var(--p-hw)"];
  return [s.charAt(0).toUpperCase() + s.slice(1), "var(--p-hw)"];
}
const PLAT_ORDER = ["Switch 2", "Switch", "Steam"];
const MOBILE = new Set(["iphone", "tablet", "ipad", "android", "móvil", "movil"]);
function platList(p){
  const all = platParts(p), ps = all.filter(x => !MOBILE.has(x)), seen = new Set();
  const list = (ps.length ? ps : all.length ? all : [""]).map(onePlat).filter(([n]) => !seen.has(n) && seen.add(n));
  const rank = n => { const i = PLAT_ORDER.indexOf(n); return i < 0 ? 99 : i; };
  return list.sort((a,b) => rank(a[0]) - rank(b[0]));
}
const platDots = p => platList(p).map(([n,c]) => `<span class="pd" style="--pc:${c}">${esc(n)}</span>`).join("");

// €/h y semáforo. 1 €/h es el punto de equilibrio (1 hora = 1 euro).
const TH = { good: 1, amber: 2.5 };
function cph(g){ if (g.price == null) return null; if (g.price === 0) return 0; if (!g.hours) return Infinity; return g.price / g.hours; }
function cphClass(v){ if (v == null) return "n"; if (v === Infinity) return "r"; return v <= TH.good ? "g" : v <= TH.amber ? "a" : "r"; }
// Estimación orientativa de lo que pagaría GAME por el juego físico de segunda mano.
// Parte de lo pagado (o de un precio típico si fue regalo), la consola y los años desde la compra.
function gameEstimate(g){
  const pl = platList(g.platform).map(x => x[0]);
  const c = pl.includes("Switch 2") ? "Switch 2" : pl.includes("Switch") ? "Switch" : null;
  if (!c) return null; // Steam y otros digitales no se pueden vender
  const yrs = Math.min(3, Math.max(0, YEAR - (g.yearBought || YEAR)));
  const base = g.price > 0 ? g.price : (c === "Switch 2" ? 60 : 45);
  const pct = (c === "Switch 2" ? [0.40, 0.33, 0.27, 0.22] : [0.30, 0.24, 0.18, 0.14])[yrs];
  return Math.max(2, Math.round(base * pct));
}
const saleValue = g => g.saleEst != null ? g.saleEst : gameEstimate(g);
function cphText(g){ const v = cph(g); if (g.price == null) return "sin precio"; if (g.price === 0) return "Regalo"; if (v === Infinity) return "sin estrenar"; return nf1.format(v) + " €/h"; }

// ---------- almacenamiento ----------
let games = [];
let settings = { weeklyHours: 8, budgets: {} };
let store = null, downloads = null, ready = false;
let logs = {}; // "AAAA-MM" -> { days: {DD: horas}, games: {id: horas} }
const queues = {};
function enqueue(id, fn){ const p = (queues[id] || Promise.resolve()).then(fn).catch(e => { console.error(e); toast("No se pudo guardar. Inténtalo otra vez."); }); queues[id] = p; return p; }
const stripId = o => { const { id, ...rest } = o; return rest; };
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function saveGame(id, patch, full){
  const i = games.findIndex(g => g.id === id);
  if (i >= 0) games[i] = { ...games[i], ...patch }; else games.push({ id, ...patch });
  render();
  if (store) return enqueue(id, () => full ? store.collection("games").doc(id).set(stripId(full)) : store.collection("games").doc(id).update(patch));
  lsSet("backlog.games", games); return Promise.resolve();
}
function removeGame(id){
  games = games.filter(g => g.id !== id); render();
  if (store) return enqueue(id, () => store.collection("games").doc(id).delete());
  lsSet("backlog.games", games); return Promise.resolve();
}
let settingsTimer;
function saveSettings(patch){
  settings = { ...settings, ...patch }; render();
  clearTimeout(settingsTimer);
  settingsTimer = setTimeout(() => { if (store) enqueue("config", () => store.doc("config/main").set(settings)); else lsSet("backlog.settings", settings); }, 500);
}
function logHours(gid, d){
  if (!d || !isFinite(d)) return;
  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  const day = String(now.getDate()).padStart(2,"0");
  const cur = logs[ym] || { days: {}, games: {} };
  const next = { days: { ...(cur.days||{}) }, games: { ...(cur.games||{}) } };
  next.days[day] = Math.max(0, Math.round(((next.days[day]||0) + d) * 100) / 100);
  next.games[gid] = Math.max(0, Math.round(((next.games[gid]||0) + d) * 100) / 100);
  logs[ym] = next;
  if (store) enqueue("log" + ym, () => store.collection("log").doc(ym).set(next)); else lsSet("backlog.logs", logs);
}
async function boot(){
  render();
  const claude = window.claude;
  const db = claude && claude.use ? await claude.use("db").catch(() => null) : null;
  if (!db) {
    games = lsGet("backlog.games", []); settings = { ...settings, ...lsGet("backlog.settings", {}) }; logs = lsGet("backlog.logs", {}); ready = true;
    const b = $("#banner"); b.hidden = false; b.textContent = "Abre esta página con tu cuenta de Claude para que los cambios se guarden en todos tus dispositivos. Ahora se guardan solo en este navegador.";
    render(); return;
  }
  store = db;
  db.collection("games").onSnapshot(snap => { games = snap.docs.map(d => ({ id: d.id, ...d.data() })); ready = true; render(); }, err => { console.error(err); ready = true; render(); });
  db.doc("config/main").onSnapshot(s => { if (s.exists) { settings = { weeklyHours: 8, budgets: {}, ...s.data() }; render(); } }, () => {});
  db.collection("log").onSnapshot(snap => { logs = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); if (ui.tab === "informes") render(); }, () => {});
  const dl = await claude.use("downloads").catch(() => null);
  if (dl) { downloads = dl; if (ui.tab === "informes") render(); }
}

// ---------- estado de la vista ----------
const ui = {
  tab: lsGet("backlog.tab", "inicio"),
  view: lsGet("backlog.view", "porjugar"),
  plat: "", q: "", sort: lsGet("backlog.sort", "lista"), saga: "", coop: false,
  rank: "peor", rankAll: false,
  sheet: null
};
if (!["inicio","juegos","deseos","ventas","economia","informes"].includes(ui.tab)) ui.tab = "inicio";
if (!["porjugar","pasados","todos"].includes(ui.view)) ui.view = "porjugar";
const juegos = () => games.filter(g => g.kind === "juego");
const hardware = () => games.filter(g => g.kind === "hardware");
const deseos = () => games.filter(g => g.kind === "deseo");
// Los juegos "Jugando" son juegos como servicio (sin final): no suman horas pendientes al backlog
const left = g => g.status === "jugando" ? 0 : Math.max((g.estimate||0) - (g.hours||0), 0);
const open = g => g.status === "pendiente" || g.status === "jugando";
const liveHours = g => (g.hours||0) + (g.sessionStart ? (Date.now()-g.sessionStart)/3600000 : 0);
function clock(ms){ const s=Math.max(0,Math.floor(ms/1000)); return `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; }
function ring(p){ const C = 2*Math.PI*12, f = Math.max(0, Math.min(1, p)); return `<svg class="ring ${f>=1?"full":""}" viewBox="0 0 30 30" aria-hidden="true"><circle class="tr" cx="15" cy="15" r="12" fill="none" stroke-width="3.5"/><circle class="pr" cx="15" cy="15" r="12" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}" transform="rotate(-90 15 15)" ${f===0?'opacity="0"':""}/></svg>`; }
const sec = (l, r="") => `<div class="sec"><span>${l}</span><span>${r}</span></div>`;

// ---------- render ----------
function render(){
  document.querySelectorAll(".nav [data-tab]").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === ui.tab)));
  $("#fab").hidden = ui.tab === "economia" || ui.tab === "informes" || ui.tab === "inicio";
  $("#fab").setAttribute("aria-label", ui.tab === "deseos" ? "Añadir deseo" : ui.tab === "ventas" ? "Añadir juegos a ventas" : "Añadir juego");
  const v = $("#view");
  if (!ready) v.innerHTML = `<div class="title"><h1>CHEMlock</h1></div><div class="empty">Cargando tus juegos…</div>`;
  else if (!games.length) v.innerHTML = `<div class="title"><h1>CHEMlock</h1></div><div class="empty">Tu colección está vacía. Pulsa <b>+</b> para añadir tu primer juego${window.chemlock ? ", o importa tus datos desde la copia que te pasé." : "."}</div>${window.chemlock ? `<label class="btn primary block" style="cursor:pointer">Importar mis datos (.json)<input type="file" id="importFile" accept="application/json,.json" hidden></label>` : ""}`;
  else if (ui.tab === "inicio") renderInicio(v);
  else if (ui.tab === "juegos") renderJuegos(v);
  else if (ui.tab === "deseos") renderDeseos(v);
  else if (ui.tab === "economia") renderEconomia(v);
  else if (ui.tab === "ventas") renderVentas(v);
  else renderInformes(v);
  if (ui.sheet?.type === "ficha") renderFicha();
  else if (ui.sheet?.type === "filtros") renderFiltros();
  else if (ui.sheet?.type === "picker") renderPicker();
}

const SORTS = [["lista","Orden de tu lista"],["cerca","Más cerca de acabar"],["largo","Más horas por delante"],["estanteria","Más tiempo en la estantería"],["caro","Más caros"],["horas","Más jugados"],["alfa","A–Z"]];
function matches(g){
  if (ui.plat && !platList(g.platform).some(([n]) => n === ui.plat)) return false;
  if (ui.saga === "__otros" ? !!g.saga : (ui.saga && g.saga !== ui.saga)) return false;
  if (ui.coop && !g.coop) return false;
  if (ui.q && !(g.title||"").toLowerCase().includes(ui.q.toLowerCase())) return false;
  return true;
}
function sortList(list){
  const S = {
    lista: (a,b) => (a.n||999)-(b.n||999),
    cerca: (a,b) => left(a) - left(b),
    largo: (a,b) => left(b) - left(a),
    estanteria: (a,b) => (a.yearBought||9999)-(b.yearBought||9999) || (a.n||0)-(b.n||0),
    caro: (a,b) => (b.price||0)-(a.price||0),
    horas: (a,b) => (b.hours||0)-(a.hours||0),
    alfa: (a,b) => (a.title||"").localeCompare(b.title||"","es")
  };
  return list.sort(S[ui.sort] || S.lista);
}

function row(g){
  const hrs = liveHours(g), est = g.estimate || 0;
  const running = !!g.sessionStart;
  let rr;
  if (running) rr = `<button class="live" data-timer="${esc(g.id)}" aria-label="Parar sesión"><span aria-hidden="true">■</span><span data-clock="${esc(g.id)}">${clock(Date.now()-g.sessionStart)}</span></button>`;
  else if (g.status === "pasado") rr = `<span class="okmark" aria-label="Pasado">${I.check}</span>`;
  else if (g.status === "abandonado") rr = `<span class="tag">Dejado</span>`;
  else if (g.status === "jugando") rr = `<button class="playb" data-timer="${esc(g.id)}" aria-label="Empezar sesión de ${esc(g.title)}">${I.play}</button>`;
  else rr = ring(est ? hrs/est : 0);
  const hoursTxt = `<span><span data-live="${esc(g.id)}">${h(hrs)}</span>${est?` / ${nf0.format(est)} h`:""}</span>`;
  const extra = (g.sold ? `<span class="tag">Vendido</span>` : g.forSale ? `<span class="tag sale">En venta</span>` : "") + (g.status === "pasado" && g.yearDone ? `<span>· ${g.yearDone}</span>` : g.coop ? `<span>· Coop</span>` : "");
  return `<div class="row ${g.status==="pasado"||g.status==="abandonado"?"done":""}" data-open="${esc(g.id)}" role="button" tabindex="0">
    <div class="rt"><div class="t">${esc(g.title)}</div><div class="s">${platDots(g.platform)}${hoursTxt}${extra}</div></div>
    <div class="rr">${rr}</div></div>`;
}

function renderJuegos(v){
  const js = juegos();
  const pend = js.filter(open), done = js.filter(g=>g.status==="pasado").length;
  const leftH = pend.reduce((s,g)=>s+left(g),0);
  const wk = Math.max(settings.weeklyHours||1, 0.5), weeks = leftH / wk;
  const base = js.filter(matches);
  const nf = (ui.plat?1:0) + (ui.saga?1:0) + (ui.coop?1:0) + (ui.sort!=="lista"?1:0);
  const pills = [
    ui.saga ? `<button class="pill-x" data-clear="saga">${ui.saga==="__otros"?"Sin saga clave":esc(ui.saga)} ${I.x}</button>` : "",
    ui.plat ? `<button class="pill-x" data-clear="plat">${esc(ui.plat)} ${I.x}</button>` : "",
    ui.coop ? `<button class="pill-x" data-clear="coop">Coop ${I.x}</button>` : "",
    ui.sort !== "lista" ? `<button class="pill-x" data-clear="sort">${esc(SORTS.find(s=>s[0]===ui.sort)?.[1]||"")} ${I.x}</button>` : ""
  ].join("");
  let body = "";
  if (ui.view === "porjugar") {
    const playing = sortList(base.filter(g=>g.status==="jugando"));
    const waiting = sortList(base.filter(g=>g.status==="pendiente"));
    if (playing.length) body += sec("Jugando", `${playing.length}`) + `<div class="group">${playing.map(row).join("")}</div>`;
    body += sec("Pendientes", `${waiting.length} · ${nf0.format(waiting.reduce((s,g)=>s+left(g),0))} h`) + (waiting.length ? `<div class="group">${waiting.map(row).join("")}</div>` : `<div class="group"><div class="empty">No hay juegos con estos filtros.</div></div>`);
  } else {
    const list = sortList(base.filter(g => ui.view === "todos" || g.status === "pasado" || g.status === "abandonado"));
    if (ui.view === "pasados") list.sort((a,b)=>(b.yearDone||0)-(a.yearDone||0) || (b.doneAt||0)-(a.doneAt||0));
    body += sec(ui.view === "pasados" ? "Terminados" : "Todos", `${list.length}`) + (list.length ? `<div class="group">${list.map(row).join("")}</div>` : `<div class="group"><div class="empty">No hay juegos con estos filtros.</div></div>`);
  }
  v.innerHTML = `
    <div class="title"><div><h1>CHEMlock</h1><div class="summary"><b>${nf0.format(leftH)} h</b> por jugar · ≈ ${weeks < 104 ? nf0.format(weeks)+" semanas" : nf1.format(weeks/52)+" años"} · <b>${done}</b> de ${js.length} pasados</div></div></div>
    <div class="bar-top">
      <div class="searchrow">
        <label class="search">${I.search}<input id="q" type="search" enterkeyhint="search" placeholder="Buscar" value="${esc(ui.q)}" aria-label="Buscar juego" autocomplete="off"></label>
        <button class="icon-btn ${nf?"on":""}" id="openFilters" aria-label="Filtros y orden${nf?`, ${nf} activos`:""}">${I.filter}</button>
      </div>
      <div class="seg" role="group" aria-label="Vista">${[["porjugar","Por jugar"],["pasados","Pasados"],["todos","Todos"]].map(([k,l])=>`<button data-view="${k}" aria-pressed="${ui.view===k}">${l}</button>`).join("")}</div>
      ${pills ? `<div class="pills">${pills}</div>` : ""}
    </div>
    ${body}`;
}

function renderDeseos(v){
  const ds = deseos();
  const years = [...new Set(ds.map(d=>d.yearTarget||YEAR))].sort();
  const spentYear = y => juegos().filter(g=>g.yearBought===y).reduce((s,g)=>s+(g.price||0),0);
  const tot = ds.reduce((s,d)=>s+(d.price||0),0);
  v.innerHTML = `<div class="title"><div><h1>Deseos</h1><div class="summary"><b>${ds.length}</b> juegos · <b>${eur0(tot)}</b> en total</div></div></div>` +
    (years.length ? years.map(y => {
      const items = ds.filter(d=>(d.yearTarget||YEAR)===y).sort((a,b)=>(a.rebuy-b.rebuy)||(a.n||0)-(b.n||0));
      const t = items.reduce((s,d)=>s+(d.price||0),0);
      const budget = settings.budgets?.[y];
      const room = budget != null ? budget - spentYear(y) : null;
      return sec(String(y), `${eur0(t)}${room!=null?` · margen <span class="${room>=t?"pos":"neg"}">${eur0(room)}</span>`:""}`) +
        `<div class="group">${items.map(d => `<div class="row">
          <button class="rt" data-edit="${esc(d.id)}" style="border:0;background:none;padding:0;text-align:left;color:inherit">
            <span class="t">${esc(d.title)}</span>
            <span class="s">${[d.price!=null?eur(d.price):"", d.rebuy?"Recompra":"", d.sizeGB?nf0.format(d.sizeGB)+" GB":"", d.saga||""].filter(Boolean).map(x=>`<span>${x}</span>`).join("<span>·</span>")}</span>
          </button>
          <button class="btn sm" data-bought="${esc(d.id)}">Comprado</button></div>`).join("")}</div>`;
    }).join("") + `<div class="note">Margen: presupuesto del año menos lo que ya has gastado ese año. Toca un deseo para editarlo.</div>`
    : `<div class="group"><div class="empty">No tienes deseos apuntados.</div></div>`);
}

function renderEconomia(v){
  const js = juegos(), hw = hardware();
  const spent = js.reduce((s,g)=>s+(g.price||0),0), hrs = js.reduce((s,g)=>s+(g.hours||0),0);
  const priced = js.filter(g=>g.price != null);
  const pricedH = priced.reduce((s,g)=>s+(g.hours||0),0), pricedE = priced.reduce((s,g)=>s+g.price,0);
  const sleepingG = js.filter(g=>open(g) && !g.hours && g.price);
  const sleeping = sleepingG.reduce((s,g)=>s+g.price,0);
  const balance = hrs - spent;
  const recovered = js.reduce((s,g)=>s+(g.sold?(g.soldPrice||0):0),0);

  const ranked = priced.map(g=>({g, v: cph(g)}));

// ---------- inicio ----------
function donut(segs, center, sub, label){
  const R = 52, W = 17, C = 2 * Math.PI * R;
  const live = segs.filter(s => s.v > 0), tot = live.reduce((s,x)=>s+x.v,0) || 1;
  const gap = live.length > 1 ? 2.5 : 0;
  let off = 0;
  const arcs = live.map(s => { const len = C * s.v / tot; const a = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${s.c}" stroke-width="${W}" stroke-dasharray="${Math.max(0.1, len - gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(s.l)}: ${s.t || s.v}</title></circle>`; off += len; return a; }).join("");
  return `<svg class="donut" viewBox="0 0 140 140" role="img" aria-label="${esc(label)}"><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--sunk)" stroke-width="${W}"/>${arcs}<text x="70" y="72" text-anchor="middle" class="dc">${center}</text><text x="70" y="91" text-anchor="middle" class="ds">${sub}</text></svg>`;
}
function legend(segs){
  const tot = segs.reduce((s,x)=>s+x.v,0) || 1;
  return `<div class="lgd">${segs.map(s => { const inner = `<i style="background:${s.c}"></i><span>${esc(s.l)}</span><b>${s.t || s.v}</b><em>${Math.round(100*s.v/tot)} %</em>`; return s.go ? `<button class="lg" data-go="${s.go}">${inner}</button>` : `<div class="lg">${inner}</div>`; }).join("")}</div>`;
}
const dcard = (segs, center, sub, label) => `<div class="dcard">${donut(segs, center, sub, label)}${legend(segs)}</div>`;
function renderInicio(v){
  const js = juegos(), n = js.length || 1;
  const cnt = s => js.filter(g => g.status === s).length;
  const pas = cnt("pasado"), aba = cnt("abandonado"), pen = cnt("pendiente"), jug = cnt("jugando");
  const estado = [
    { l: "Pasados", v: pas + aba, c: "var(--good)", go: "pasados" },
    { l: "Pendientes", v: pen, c: "var(--bad)", go: "porjugar" },
    { l: "Jugando", v: jug, c: "var(--yellow)", go: "porjugar" }
  ];
  const played = js.reduce((s,g)=>s+(g.hours||0),0), toPlay = js.filter(open).reduce((s,g)=>s+left(g),0);
  const horas = [
    { l: "Jugadas", v: played, t: nf0.format(played) + " h", c: "var(--good)" },
    { l: "Por jugar", v: toPlay, t: nf0.format(toPlay) + " h", c: "var(--bad)" }
  ];
  const pc = {};
  js.filter(g => g.status === "pendiente").forEach(g => { const [k, c] = platList(g.platform)[0]; const o = pc[k] = pc[k] || { l: k, v: 0, c }; o.v++; });
  const consolas = Object.values(pc).sort((a,b) => b.v - a.v);
  const priced = js.filter(g => g.price != null).map(g => cphClass(cph(g)));
  const rent = [
    { l: "Rentables", v: priced.filter(x=>x==="g").length, c: "var(--good)" },
    { l: "Casi", v: priced.filter(x=>x==="a").length, c: "var(--yellow)" },
    { l: "Caros o sin estrenar", v: priced.filter(x=>x==="r").length, c: "var(--bad)" }
  ];
  const pctDone = Math.round(100 * (pas + aba) / n);
  v.innerHTML = `
    <div class="title"><div><h1>CHEMlock</h1><div class="summary"><b>${js.length}</b> juegos · <b>${nf0.format(toPlay)} h</b> por jugar</div></div></div>
    ${sec("Tu colección", "toca para ver la lista")}
    ${dcard(estado, pctDone + " %", "terminado", `${pctDone} % de la colección terminada`)}
    ${sec("Horas")}
    ${dcard(horas, Math.round(100 * played / ((played + toPlay) || 1)) + " %", "jugado", "Horas jugadas frente a horas por jugar")}
    ${sec("Pendientes por consola")}
    ${dcard(consolas, String(pen), "pendientes", "Juegos pendientes por consola")}
    ${sec("Rentabilidad de tus compras", "1 h por €")}
    ${dcard(rent, Math.round(100 * rent[0].v / (priced.length || 1)) + " %", "rentables", "Rentabilidad de los juegos con precio")}
    <div class="note">Los juegos que están en varias consolas cuentan en la principal. "Jugando" son tus juegos como servicio.</div>`;
}

// ---------- informes ----------
const dkey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function weekStart(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay()+6)%7); return x; }
function dayHours(){ const out = {}; Object.entries(logs).forEach(([ym, doc]) => Object.entries(doc.days||{}).forEach(([dd, x]) => { out[`${ym}-${dd}`] = (out[`${ym}-${dd}`]||0) + x; })); return out; }
const median = a => { if (!a.length) return null; const s = [...a].sort((x,y)=>x-y), m = Math.floor(s.length/2); return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };
function vsTxt(x, y, lowerBetter, money){
  const d = x - y; if (!d) return `igual que ${YEAR-1}`;
  const good = lowerBetter ? d < 0 : d > 0;
  return `<span class="${good?"pos":"neg"}">${d>0?"+":"−"}${money ? eur0(Math.abs(d)) : Math.abs(d)}</span> vs ${YEAR-1}`;
}
function renderInformes(v){
  const js = juegos(), pend = js.filter(open), today = new Date();
  const leftH = pend.reduce((s,g)=>s+left(g),0);
  const ratio = median(js.filter(g => g.status==="pasado" && g.estimate>0 && g.hours>0).map(g => g.hours/g.estimate));
  const leftAdj = ratio ? pend.reduce((s,g)=>s+Math.max((g.estimate||0)*ratio-(g.hours||0),0),0) : leftH;
  const wk = Math.max(settings.weeklyHours||1, 0.5);
  const wks = leftAdj / wk;
  const finishTxt = wks > 52*40 ? "dentro de más de 40 años" : new Date(today.getTime() + wks*7*86400000).toLocaleDateString("es-ES",{month:"long",year:"numeric"});
  const firstYear = Math.min(...js.map(g=>g.yearBought).filter(Boolean), YEAR);
  const span = Math.max(0.5, (YEAR - firstYear) + (today - new Date(YEAR,0,1))/(365*86400000));
  const boughtPY = js.length / span, donePY = js.filter(g=>g.status==="pasado"||g.status==="abandonado").length / span, net = boughtPY - donePY;

  const dh = dayHours(), hasLog = Object.keys(dh).length > 0, ws = weekStart(today);
  const weeks = [];
  for (let i = 7; i >= 0; i--) { const s = new Date(ws); s.setDate(s.getDate()-7*i); let t = 0; for (let k = 0; k < 7; k++) { const d = new Date(s); d.setDate(d.getDate()+k); t += dh[dkey(d)]||0; } weeks.push({ s, t, now: i === 0 }); }
  const maxW = Math.max(1, ...weeks.map(w=>w.t));
  const ym = dkey(today).slice(0,7);
  const monthH = Object.values(logs[ym]?.days||{}).reduce((s,x)=>s+x,0);
  const topMonth = Object.entries(logs[ym]?.games||{}).filter(([,x])=>x>0).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([id,x])=>({ g: games.find(g=>g.id===id), x })).filter(o=>o.g);
  const firstDay = Object.keys(dh).sort()[0];
  const tracked = firstDay ? (today - new Date(firstDay)) / 86400000 + 1 : 0;
  const realPace = tracked >= 14 ? Object.values(dh).reduce((s,x)=>s+x,0) / tracked * 7 : null;

  const yStat = y => { const b = js.filter(g=>g.yearBought===y); return { b: b.length, d: js.filter(g=>g.yearDone===y).length, e: b.reduce((s,g)=>s+(g.price||0),0) }; };
  const ya = yStat(YEAR), yp = yStat(YEAR-1);

  const sg = {};
  js.forEach(g => { const k = g.saga||"Otros"; const o = sg[k] = sg[k] || { n:0, d:0, lh:0 }; o.n++; if (g.status==="pasado") o.d++; if (open(g)) o.lh += left(g); });
  const sagaRows = Object.entries(sg).sort((a,b)=>(a[0]==="Otros")-(b[0]==="Otros") || b[1].lh-a[1].lh).map(([k,o]) => `<button class="row" data-saga="${esc(k==="Otros"?"__otros":k)}" style="flex-wrap:wrap;gap:6px 12px"><span class="rt" style="flex:1 1 60%"><span class="t">${esc(k)}</span><span class="s"><span>${o.d} de ${o.n} pasados</span></span></span><span class="right">${nf0.format(o.lh)} h</span><span class="bar" style="flex:1 1 100%"><i style="width:${100*o.d/o.n}%;background:var(--good)"></i></span></button>`).join("");

  const pc = {};
  pend.forEach(g => platList(g.platform).forEach(([k,c]) => { const o = pc[k] = pc[k] || { n:0, h:0, c }; o.n++; o.h += left(g); }));
  const maxP = Math.max(1, ...Object.values(pc).map(o=>o.h));
  const platRows = Object.entries(pc).sort((a,b)=>b[1].h-a[1].h).map(([k,o]) => `<div class="row" style="flex-wrap:wrap;gap:6px 12px"><span class="rt" style="flex:1 1 60%"><span class="s" style="font-size:14px"><span class="pd" style="--pc:${o.c}">${esc(k)}</span></span><span class="s"><span>${o.n} juegos</span></span></span><span class="right">${nf0.format(o.h)} h</span><span class="bar" style="flex:1 1 100%"><i style="width:${100*o.h/maxP}%;background:${o.c}"></i></span></div>`).join("");

  const last = lsGet("backlog.lastExport", null);
  const days = last ? Math.floor((Date.now()-last)/86400000) : null;

  v.innerHTML = `
    <div class="title"><div><h1>Informes</h1></div></div>
    ${sec("¿Cuándo acabas el backlog?")}
    <div class="card">
      <div class="big">${finishTxt.charAt(0).toUpperCase()+finishTxt.slice(1)}</div>
      <div class="s" style="font-size:14px">jugando <input id="wk" class="inline-in" inputmode="decimal" value="${nf1.format(wk)}" aria-label="Horas de juego por semana"> h a la semana${realPace?` · tu media real: ${nf1.format(realPace)} h`:""}</div>
      <div class="s" style="font-size:14px;display:block">Te quedan <b style="color:var(--ink)">${nf0.format(leftH)} h</b> según tus estimaciones${ratio && Math.abs(ratio-1) > 0.05 ? `, unas ${nf0.format(leftAdj)} h ajustando a lo que sueles tardar (${nf0.format(ratio*100)} % de lo estimado)` : ""}.</div>
      <div class="s" style="font-size:14px;display:block">${net > 0.5 ? `Compras unos <b style="color:var(--ink)">${nf0.format(boughtPY)}</b> juegos al año y terminas unos <b style="color:var(--ink)">${nf0.format(donePY)}</b>: el backlog crece unos ${nf0.format(net)} juegos al año.` : `Terminas al menos tantos juegos como compras: el backlog no crece.`}</div>
    </div>

    ${sec("Tu ritmo", "horas por semana")}
    <div class="card">
      ${hasLog ? `
      <div class="wbars">${weeks.map(w => `<div class="wb ${w.now?"now":""}"><b>${w.t?nf1.format(w.t):""}</b><i style="height:${Math.max(3, Math.round(80*w.t/maxW))}px"></i><span>${w.s.getDate()}/${w.s.getMonth()+1}</span></div>`).join("")}</div>
      <div class="s" style="font-size:14px">Esta semana <b style="color:var(--ink)">${h(weeks[7].t)}</b> · este mes <b style="color:var(--ink)">${h(monthH)}</b>${realPace?` · media <b style="color:var(--ink)">${h(realPace)}</b>`:""}</div>
      ${topMonth.length ? `<div class="s" style="display:block">Lo más jugado este mes: ${topMonth.map(o=>`${esc(o.g.title)} (${h(o.x)})`).join(", ")}.</div>` : ""}`
      : `<div class="s" style="font-size:14px;display:block">Aún no hay sesiones registradas. Cada vez que uses el cronómetro o los botones +½ y +1 de un juego, aquí verás cuántas horas juegas cada semana.</div>`}
    </div>

    ${sec(`${YEAR} hasta hoy`)}
    <div class="tiles" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="tile"><div class="k">Comprados</div><div class="v">${ya.b}</div><div class="n">${vsTxt(ya.b, yp.b, true)}</div></div>
      <div class="tile"><div class="k">Pasados</div><div class="v">${ya.d}</div><div class="n">${vsTxt(ya.d, yp.d, false)}</div></div>

    </div>

    ${sec("Sagas", "horas pendientes")}<div class="group">${sagaRows}</div>
    ${sec("Pendiente por consola")}<div class="group">${platRows || `<div class="empty">No tienes nada pendiente.</div>`}</div>
    <div class="note">Los juegos que tienes en varias consolas cuentan en cada una.</div>

    ${sec("Copia de seguridad")}
    <div class="card">
      <div class="s" style="font-size:14px;display:block">${last ? `Última copia desde este dispositivo: hace ${days} ${days===1?"día":"días"}.` : "Aún no has hecho ninguna copia desde este dispositivo."}${!last || days > 30 ? ` <b style="color:var(--ink)">Te conviene hacer una.</b>` : ""}</div>
      ${downloads ? `<button class="btn primary block" id="btnExport">Descargar Excel</button>` : `<div class="s">La descarga está disponible al abrir la página desde Claude.</div>`}

    ${window.chemlock ? `${sec("Cuenta")}
    <div class="card">
      <div class="s" style="font-size:14px;display:block">Sesión iniciada como <b style="color:var(--ink)">${esc(window.chemlock.email())}</b></div>
      <label class="btn block" style="cursor:pointer">Importar datos (.json)<input type="file" id="importFile" accept="application/json,.json" hidden></label>
      <button class="btn block" id="logout">Cerrar sesión</button>
    </div>` : ""}`;
}

// ---------- hojas ----------
function showSheet(html, label){
  const prev = $("#sheet .box")?.scrollTop || 0;
  $("#sheetHost").innerHTML = `<div class="sheet" id="sheet"><div class="box" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="grab"></div>${html}</div></div>`;
  $("#sheet .box").scrollTop = prev;
  document.body.classList.add("locked");
}
function closeSheet(){ $("#sheetHost").innerHTML = ""; ui.sheet = null; document.body.classList.remove("locked"); }
const closeBtn = `<button class="closeb" data-close aria-label="Cerrar">${I.x}</button>`;

function renderFicha(){
  const g = games.find(x => x.id === ui.sheet.id);
  if (!g) { closeSheet(); return; }
  const hrs = liveHours(g), est = g.estimate || 0;
  const pct = est ? Math.min(100, 100*hrs/est) : (hrs?100:0);
  const running = !!g.sessionStart;
  const diffTxt = !est ? "sin estimación" : hrs >= est ? `${h(hrs-est)} más de lo estimado` : `faltan ${h(est-hrs)}`;
  const kv = [
    ["Precio", g.price===0?"Regalo":eur(g.price)],
    ["Rentabilidad", `<span class="eur ${cphClass(cph(g))}">${cphText(g)}</span>`],
    ["Saga", esc(g.saga||"Otros")],
    ["Comprado", g.yearBought||"—"],
    ...(g.yearDone ? [["Pasado en", g.yearDone]] : []),
    ...(g.coop ? [["Modo", "Cooperativo"]] : []),
    ...(g.lentTo ? [["Prestado a", esc(g.lentTo)]] : []),
    ...(g.notes ? [["Notas", esc(g.notes)]] : [])
  ];
  showSheet(`
    <div class="sh"><div style="min-width:0;display:grid;gap:6px"><h2>${esc(g.title)}</h2><div class="s">${platDots(g.platform)}</div></div>${closeBtn}</div>
    <div class="seg" role="group" aria-label="Estado">${STATUS.map(([k,l])=>`<button data-s="${k}" data-status="${esc(g.id)}" aria-pressed="${g.status===k}" style="font-size:13px">${k==="abandonado"?"Dejado":l}</button>`).join("")}</div>
    <div class="hours">
      <div><div class="n"><span data-live="${esc(g.id)}">${nf1.format(hrs)}</span> <small>de ${est?nf1.format(est):"—"} h</small></div><div class="s" style="margin-top:4px">${diffTxt}</div></div>
      <div class="bar"><i style="width:${pct}%;${est && hrs>=est?"background:var(--good)":""}"></i></div>
      <div class="stepper"><button data-step="-0.5" data-id="${esc(g.id)}" aria-label="Restar media hora">−½ h</button><button data-step="0.5" data-id="${esc(g.id)}" aria-label="Sumar media hora">+½ h</button><button data-step="1" data-id="${esc(g.id)}" aria-label="Sumar una hora">+1 h</button></div>
      <button class="btn block ${running?"live":"primary"}" data-timer="${esc(g.id)}">${running?`■ Parar sesión · <span data-clock="${esc(g.id)}">${clock(Date.now()-g.sessionStart)}</span>`:`${I.play.replace('aria-hidden','width="16" height="16" aria-hidden')} Empezar sesión`}</button>
    </div>
    <div class="group">${kv.map(([k,v])=>`<div class="kv"><span>${k}</span><span>${v}</span></div>`).join("")}</div>
    ${saleBlock(g)}
    <button class="btn block" data-edit="${esc(g.id)}">Editar datos</button>`, g.title);
}
function saleBlock(g){
  const val = gameEstimate(g);
  if (g.sold) return `${sec("Venta")}<div class="group"><div class="kv"><span>Vendido por</span><span>${eur(g.soldPrice||0)}</span></div></div><button class="btn block" data-unsell="${esc(g.id)}">Deshacer venta</button>`;
  if (g.forSale) return `${sec("Venta")}<div class="group">
    <div class="kv"><span>Estimado en GAME</span><span>${val==null?"Digital, no se vende":"≈ "+eur0(val)}</span></div>
    <div class="field"><label for="saleEst">Tasación real de GAME (€)</label><input id="saleEst" data-id="${esc(g.id)}" inputmode="decimal" placeholder="Apúntala cuando la consultes" value="${g.saleEst!=null?String(g.saleEst).replace(".",","):""}"></div>
    <div class="field"><label for="soldIn">Precio de venta (€)</label><input id="soldIn" inputmode="decimal" value="${saleValue(g)!=null?String(saleValue(g)).replace(".",","):""}"></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn" data-sale="${esc(g.id)}">Quitar de ventas</button><button class="btn primary" data-sell="${esc(g.id)}">Marcar vendido</button></div>`;
  return `<button class="btn block" data-sale="${esc(g.id)}">Añadir a posibles ventas${val!=null?` · ≈ ${eur0(val)} en GAME`:""}</button>`;
}

function renderFiltros(){
  const plats = [...new Set(juegos().flatMap(g=>platList(g.platform).map(x=>x[0])))].sort((a,b)=>PLAT_ORDER.indexOf(a)===-1?1:PLAT_ORDER.indexOf(b)===-1?-1:PLAT_ORDER.indexOf(a)-PLAT_ORDER.indexOf(b));
  const sagas = [...new Set([...KEY_SAGAS, ...juegos().map(g=>g.saga).filter(Boolean)])];
  showSheet(`
    <div class="sh"><h2>Filtros</h2>${closeBtn}</div>
    <div class="group">
      <div class="field"><label for="sort">Ordenar por</label><select id="sort">${SORTS.map(([k,l])=>`<option value="${k}" ${ui.sort===k?"selected":""}>${l}</option>`).join("")}</select></div>
      <div class="field"><label for="plat">Consola</label><select id="plat"><option value="">Todas</option>${plats.map(p=>`<option ${ui.plat===p?"selected":""}>${esc(p)}</option>`).join("")}</select></div>
      <div class="field"><label for="sagaSel">Saga</label><select id="sagaSel"><option value="">Todas</option>${sagas.map(s=>`<option value="${esc(s)}" ${ui.saga===s?"selected":""}>${esc(s)}</option>`).join("")}<option value="__otros" ${ui.saga==="__otros"?"selected":""}>Otros (sin saga clave)</option></select></div>
      <div class="field check"><label for="coop">Solo cooperativos</label><input type="checkbox" id="coop" ${ui.coop?"checked":""}></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn" id="resetFilters">Quitar filtros</button><button class="btn primary" data-close>Ver juegos</button></div>`, "Filtros");
}

function openForm(id, kind){
  ui.sheet = null;
  const g = id ? games.find(x=>x.id===id) : { kind: kind||"juego", status: kind==="deseo"?"deseado":"pendiente", hours:0, estimate:null, price:null, yearBought: YEAR, coop:false, title:"", platform:"", saga:"", lentTo:"", notes:"", yearTarget: YEAR };
  if (!g) return;
  const plats = [...new Set(games.map(x=>x.platform).filter(Boolean))].sort();
  const sagaList = [...new Set([...KEY_SAGAS, ...games.map(x=>x.saga).filter(Boolean)])];
  const F = (k, l, inner) => `<div class="field"><label for="f_${k}">${l}</label>${inner}</div>`;
  const txt = (k, l, extra="") => F(k, l, `<input id="f_${k}" value="${esc(g[k])}" autocomplete="off" ${extra}>`);
  const num = (k, l) => F(k, l, `<input id="f_${k}" inputmode="decimal" value="${g[k]!=null?String(g[k]).replace(".",","):""}">`);
  const yr = (k, l) => F(k, l, `<input id="f_${k}" inputmode="numeric" value="${g[k]||""}">`);
  const sagaSel = F("saga", "Saga", `<select id="f_saga">${sagaList.map(s=>`<option value="${esc(s)}" ${g.saga===s?"selected":""}>${esc(s)}</option>`).join("")}<option value="" ${!g.saga?"selected":""}>Otros</option></select>`);
  const chk = (k, l) => `<div class="field check"><label for="f_${k}">${l}</label><input type="checkbox" id="f_${k}" ${g[k]?"checked":""}></div>`;
  const notes = F("notes", "Notas", `<textarea id="f_notes" rows="2">${esc(g.notes)}</textarea>`);
  const platIn = l => F("platform", l, `<input id="f_platform" list="dlPlat" value="${esc(g.platform)}" autocomplete="off" placeholder="Ej.: Switch 2, Steam y Nintendo Switch">`);
  let groups;
  if (g.kind === "deseo") groups = [
    [txt("title","Título"), platIn("Consola")],
    [`<div class="two">${yr("yearTarget","Año previsto")}${num("price","Precio (€)")}</div>`, `<div class="two">${num("sizeGB","Tamaño (GB)")}${sagaSel}</div>`, chk("rebuy","Recompra")],
    [notes]];
  else if (g.kind === "hardware") groups = [
    [txt("title","Equipo"), platIn("Consola que cubre")],
    [`<div class="two">${yr("yearBought","Año de compra")}${num("price","Precio (€)")}</div>`],
    [notes]];
  else groups = [
    [txt("title","Título"), platIn("Consola"), F("status","Estado",`<select id="f_status">${STATUS.map(([k,l])=>`<option value="${k}" ${g.status===k?"selected":""}>${l}</option>`).join("")}</select>`)],
    [`<div class="two">${num("hours","Horas jugadas")}${num("estimate","Horas estimadas")}</div>`, `<div class="two">${num("price","Precio (€, 0 si regalo)")}${sagaSel}</div>`, `<div class="two">${yr("yearBought","Año de compra")}${yr("yearDone","Año en que lo pasaste")}</div>`],
    [txt("lentTo","Prestado a"), chk("coop","Para jugar en cooperativo"), notes]];
  const head = id ? "Editar" : g.kind==="deseo" ? "Nuevo deseo" : g.kind==="hardware" ? "Nuevo equipo" : "Nuevo juego";
  showSheet(`
    <div class="sh"><h2>${head}</h2>${closeBtn}</div>
    <form id="sForm" style="display:grid;gap:12px">${groups.map(gr=>`<div class="group">${gr.join("")}</div>`).join("")}<datalist id="dlPlat">${plats.map(p=>`<option value="${esc(p)}">`).join("")}</datalist></form>
    <button class="btn primary block" id="sSave">Guardar</button>
    ${id?`<button class="btn danger block" id="sDel">Borrar</button><button class="btn danger block" id="sDelYes" hidden>Sí, borrar para siempre</button>`:""}`, head);
  if (!id) setTimeout(() => $("#f_title")?.focus(), 60);
  $("#sForm").onsubmit = e => { e.preventDefault(); $("#sSave").click(); };
  if (id) { $("#sDel").onclick = () => { $("#sDelYes").hidden = false; $("#sDel").hidden = true; }; $("#sDelYes").onclick = () => { removeGame(id); closeSheet(); toast("Borrado"); }; }
  $("#sSave").onclick = () => {
    const val = k => $("#f_"+k)?.value?.trim() ?? "";
    const t = val("title"); if (!t) { $("#f_title").focus(); toast("Escribe un título"); return; }
    const intOrNull = k => { const n = parseInt(val(k),10); return isFinite(n) ? n : null; };
    const p = { title: t, platform: val("platform"), notes: val("notes") };
    if (g.kind === "deseo") Object.assign(p, { yearTarget: intOrNull("yearTarget"), price: parseNum(val("price")), sizeGB: parseNum(val("sizeGB")), saga: val("saga"), rebuy: $("#f_rebuy").checked });
    else if (g.kind === "hardware") Object.assign(p, { yearBought: intOrNull("yearBought"), price: parseNum(val("price")) });
    else Object.assign(p, { status: val("status"), hours: parseNum(val("hours")) || 0, estimate: parseNum(val("estimate")), price: parseNum(val("price")), saga: val("saga"), yearBought: intOrNull("yearBought"), yearDone: intOrNull("yearDone"), lentTo: val("lentTo"), coop: $("#f_coop").checked });
    if (g.kind === "juego" && p.status === "pasado" && !p.yearDone) p.yearDone = YEAR;
    if (id) {
      if (g.kind === "juego" && p.hours !== (g.hours||0)) logHours(id, p.hours - (g.hours||0));
      saveGame(id, p); closeSheet();
      if (g.kind === "juego") { ui.sheet = { type: "ficha", id }; render(); }
    } else {
      const maxN = Math.max(0, ...games.filter(x=>x.kind===g.kind).map(x=>x.n||0));
      const full = { ...g, ...p, n: maxN + 1, sessionStart: null, addedAt: Date.now() };
      saveGame(newId(g.kind==="deseo"?"w":"g"), full, full); closeSheet();
    }
    toast("Guardado");
  };
}

// ---------- acciones ----------
function setStatus(id, s){
  const g = games.find(x=>x.id===id); if (!g || g.status === s) return;
  const p = { status: s };
  if (s === "pasado") { if (!g.yearDone) p.yearDone = YEAR; p.doneAt = Date.now(); }
  if (s !== "pasado" && s !== "abandonado") p.yearDone = null;
  if (g.sessionStart && (s === "pasado" || s === "abandonado")) { logHours(id, liveHours(g) - (g.hours||0)); p.hours = Math.round(liveHours(g)*10)/10; p.sessionStart = null; }
  saveGame(id, p);
  if (s === "pasado") toast(`¡${g.title} pasado!`);
}
function toggleTimer(id){
  const g = games.find(x=>x.id===id); if (!g) return;
  if (g.sessionStart) {
    const add = (Date.now() - g.sessionStart) / 3600000;
    logHours(id, add);
    saveGame(id, { sessionStart: null, hours: Math.round(((g.hours||0) + add) * 10) / 10 });
    toast(`Sesión guardada: +${h(Math.round(add*10)/10)}`);
  } else {
    saveGame(id, { sessionStart: Date.now() }); toast("Sesión en marcha");
  }
}
function step(id, d){
  const g = games.find(x=>x.id===id); if (!g) return;
  const p = { hours: Math.max(0, Math.round(((g.hours||0) + d) * 10) / 10) };
  logHours(id, p.hours - (g.hours||0));
  saveGame(id, p);
}
function bought(id){
  const d = games.find(x=>x.id===id); if (!d) return;
  const maxN = Math.max(0, ...juegos().map(x=>x.n||0));
  const full = { n: maxN+1, kind:"juego", title:d.title, platform:d.platform||"", status:"pendiente", coop:false, yearBought:YEAR, yearDone:null, hours:0, estimate:null, price:d.price??null, saga:d.saga||"", lentTo:"", notes:d.notes||"", sessionStart:null, addedAt: Date.now() };
  const nid = newId("g");
  saveGame(nid, full, full).then(() => removeGame(id));
  toast("Añadido a tus juegos. Revisa precio y horas.");
  setTimeout(() => openForm(nid), 250);
}

// ---------- exportar ----------
function loadXLSX(){ return new Promise((res, rej) => { if (window.XLSX) return res(window.XLSX); const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = () => res(window.XLSX); s.onerror = rej; document.head.appendChild(s); }); }
async function exportXlsx(){
  try {
    const X = await loadXLSX();
    const wb = X.utils.book_new();
    const rows = juegos().sort((a,b)=>(a.n||0)-(b.n||0)).map(g => { const c = cph(g); return { "Nº": g.n, "Videojuego": g.title, "Plataforma": g.platform, "Estado": STATUS_LABEL[g.status]||g.status, "Coop": g.coop?"Sí":"", "Saga": g.saga, "Año compra": g.yearBought, "Año jugado": g.yearDone, "Horas de juego": g.hours, "Estimación horas": g.estimate, "Precio (€)": g.price, "€/h": c==null||c===Infinity?null:Math.round(c*100)/100, "Horas − €": g.price!=null?Math.round(((g.hours||0)-g.price)*100)/100:null, "En venta": g.forSale?"Sí":"", "Vendido por (€)": g.sold?g.soldPrice:null, "Prestado a": g.lentTo, "Notas": g.notes }; });
    X.utils.book_append_sheet(wb, X.utils.json_to_sheet(rows), "Juegos");
    X.utils.book_append_sheet(wb, X.utils.json_to_sheet(hardware().map(x => ({ "Equipo": x.title, "Consola": x.platform, "Año": x.yearBought, "Precio (€)": x.price }))), "Hardware");
    X.utils.book_append_sheet(wb, X.utils.json_to_sheet(deseos().map(d => ({ "Año": d.yearTarget, "Juego": d.title, "Precio (€)": d.price, "Recompra": d.rebuy?"Sí":"", "GB": d.sizeGB, "Notas": d.notes }))), "Deseos");
    await downloads.save({ filename: `CHEMlock ${new Date().toISOString().slice(0,10)}.xlsx`, data: X.write(wb, { bookType: "xlsx", type: "array" }) });
    lsSet("backlog.lastExport", Date.now()); toast("Excel descargado"); render();
  } catch (e) { if (e && e.code === "declined") return; console.error(e); toast("No se pudo generar el Excel"); }
}

// ---------- eventos ----------
document.addEventListener("click", e => {
  if (e.target.id === "sheet") { closeSheet(); return; }
  const el = e.target.closest("button, [data-open]");
  if (!el) return;
  const d = el.dataset;
  if (d.close !== undefined) { closeSheet(); return; }
  if (d.timer) { e.stopPropagation(); toggleTimer(d.timer); return; }
  if (d.tab) { ui.tab = d.tab; lsSet("backlog.tab", ui.tab); window.scrollTo(0,0); render(); return; }
  if (d.go) { ui.tab = "juegos"; ui.view = d.go; lsSet("backlog.tab", ui.tab); lsSet("backlog.view", ui.view); window.scrollTo(0,0); render(); return; }
  if (d.view) { ui.view = d.view; lsSet("backlog.view", ui.view); render(); return; }
  if (d.status) { setStatus(d.status, d.s); return; }
  if (d.step) { step(d.id, parseFloat(d.step)); return; }
  if (d.edit) { openForm(d.edit); return; }
  if (d.bought) { bought(d.bought); return; }
  if (d.clear) { if (d.clear === "sort") { ui.sort = "lista"; lsSet("backlog.sort", ui.sort); } else ui[d.clear] = d.clear === "coop" ? false : ""; render(); return; }
  if (d.saga) { ui.saga = d.saga; ui.tab = "juegos"; ui.view = "porjugar"; window.scrollTo(0,0); render(); return; }
  if (d.rank) { ui.rank = d.rank; render(); return; }
  if (d.sale || d.pick) { const gid = d.sale || d.pick; const g = games.find(x=>x.id===gid); if (g) { saveGame(gid, { forSale: !g.forSale }); if (d.sale) toast(g.forSale ? "Quitado de ventas" : "Añadido a posibles ventas"); } return; }
  if (d.sell) { const n = parseNum($("#soldIn")?.value); if (n == null) { toast("Escribe el precio de venta"); return; } saveGame(d.sell, { sold: true, soldPrice: n, soldAt: Date.now(), forSale: false }); toast("Venta apuntada"); return; }
  if (d.unsell) { saveGame(d.unsell, { sold: false, soldPrice: null, soldAt: null, forSale: true }); return; }
  if (d.open) { const g = games.find(x=>x.id===d.open); if (g && g.kind === "juego") { ui.sheet = { type: "ficha", id: d.open }; render(); } return; }
  switch (el.id) {
    case "fab": if (ui.tab === "ventas") { ui.pq = ""; ui.sheet = { type: "picker" }; render(); } else openForm(null, ui.tab === "deseos" ? "deseo" : "juego"); break;
    case "addHw": openForm(null, "hardware"); break;
    case "openFilters": ui.sheet = { type: "filtros" }; render(); break;
    case "resetFilters": ui.plat = ""; ui.coop = false; ui.saga = ""; ui.sort = "lista"; lsSet("backlog.sort", ui.sort); render(); break;
    case "rankAll": ui.rankAll = !ui.rankAll; render(); break;
    case "btnExport": exportXlsx(); break;
    case "logout": if (window.chemlock) window.chemlock.logout(); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#sheet")) closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".row[data-open]")) { e.preventDefault(); e.target.click(); }
});
let qTimer;
document.addEventListener("input", e => {
  if (e.target.id === "pq") { ui.pq = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(() => { render(); const q = $("#pq"); if (q) { q.focus(); const n = q.value.length; try { q.setSelectionRange(n,n); } catch {} } }, 180); }
  if (e.target.id === "q") { ui.q = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(() => { const pos = e.target.selectionStart; render(); const q = $("#q"); if (q) { q.focus(); try { q.setSelectionRange(pos,pos); } catch {} } }, 180); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "plat") { ui.plat = t.value; render(); }
  else if (t.id === "sagaSel") { ui.saga = t.value; render(); }
  else if (t.id === "sort") { ui.sort = t.value; lsSet("backlog.sort", ui.sort); render(); }
  else if (t.id === "coop") { ui.coop = t.checked; render(); }
  else if (t.id === "importFile" && t.files && t.files[0] && window.chemlock) {
    toast("Importando…");
    window.chemlock.importFile(t.files[0]).then(n => toast(`Importados ${n} juegos`)).catch(err => { console.error(err); toast("No se pudo importar ese archivo"); });
  }
  else if (t.id === "saleEst") { saveGame(t.dataset.id, { saleEst: parseNum(t.value) }); }
  else if (t.id === "wk") { const n = parseNum(t.value); if (n && n > 0) saveSettings({ weeklyHours: n }); }
  else if (t.dataset.budget) { const n = parseNum(t.value); const b = { ...(settings.budgets||{}) }; if (n == null) delete b[t.dataset.budget]; else b[t.dataset.budget] = n; saveSettings({ budgets: b }); }
});

// Reloj de las sesiones en marcha (solo pinta, no guarda)
setInterval(() => {
  games.forEach(g => {
    if (!g.sessionStart) return;
    document.querySelectorAll(`[data-clock="${CSS.escape(g.id)}"]`).forEach(c => c.textContent = clock(Date.now() - g.sessionStart));
    document.querySelectorAll(`[data-live="${CSS.escape(g.id)}"]`).forEach(l => l.textContent = l.closest(".hours") ? nf1.format(liveHours(g)) : h(liveHours(g)));
  });
}, 1000);

boot();
})();
</script>
